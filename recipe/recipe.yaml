schema_version: 1

context:
  name: proglog
  version: "0.1.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 361ee074721c277b89b75c061336cb8c5f287c92b043efa562ccf7866cda931c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - tqdm

tests:
  - python:
      imports:
        - proglog
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  license: MIT
  license_file: LICENSE
  summary: Logs and progress bars manager for Python
  description: |
    Proglog is a progress logging system for Python. It allows to build
    complex libraries while giving your users control over logs, callbacks
    and progress bars.
  homepage: https://github.com/Edinburgh-Genome-Foundry/Proglog
  repository: https://github.com/Edinburgh-Genome-Foundry/Proglog

extra:
  recipe-maintainers:
    - mdraw
